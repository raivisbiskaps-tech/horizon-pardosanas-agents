<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
#btn {
    width: 100%; height: 100%;
    border: none; border-radius: 50%;
    background: transparent;
    cursor: pointer;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
}
#btn:hover { background: rgba(0,0,0,.08); }
#btn.rec { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse {
    0%,100% { filter: drop-shadow(0 0 0px rgba(220,38,38,0)); }
    50%      { filter: drop-shadow(0 0 7px rgba(220,38,38,.9)); }
}
</style>
</head>
<body>
<button id="btn" title="Ierunāt">🎙️</button>
<script>
"use strict";

/* ── Streamlit protokols ──────────────────────────────────────────────────── */
var _lastCounter = -1;

function post(msg) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), '*');
}
function setValue(v) { post({ type: 'streamlit:setComponentValue', value: v, dataType: 'json' }); }

window.addEventListener('message', function(ev) {
    if (!ev.data || ev.data.type !== 'streamlit:render') return;
    var c = (ev.data.args || {}).reset_counter;
    if (c == null) c = 0;
    if (c !== _lastCounter) { _lastCounter = c; if (recording) stopRec(); }
});

post({ type: 'streamlit:setFrameHeight', height: 36 });
post({ type: 'streamlit:componentReady', apiVersion: 1 });

/* ── Pozicionēšana — BEZ iframe pārvietošanas ───────────────────────────── */
/* Iframe paliek Streamlit DOM kokā (lai saglabātu saziņu).
   Tā vietā parent div iegūst position:fixed.                               */
var SZ = 36;

function fix() {
    try {
        var pd = window.parent.document;

        /* Atrod šo iframe parent dokumentā */
        var me = null;
        var frames = pd.querySelectorAll('iframe');
        for (var i = 0; i < frames.length; i++) {
            try { if (frames[i].contentWindow === window) { me = frames[i]; break; } } catch(e) {}
        }
        if (!me) return;

        /* Tūlītējais vecāks — tas, kuram piešķiram fixed */
        var target = me.parentElement;
        if (!target || target === pd.body) return;

        /* Atrod st.chat_input sūtīšanas pogu */
        var sendBtn = pd.querySelector('[data-testid="stBottom"] button');
        if (!sendBtn) return;

        var r = sendBtn.getBoundingClientRect();
        var W = window.parent;
        var bottom = Math.round(W.innerHeight - r.top - r.height / 2 - SZ / 2);
        var right  = Math.round(W.innerWidth  - r.left + 6);

        /* Piešķir fixed vecākajam elementam */
        target.style.cssText =
            'position:fixed!important;' +
            'bottom:'  + bottom + 'px!important;' +
            'right:'   + right  + 'px!important;' +
            'width:'   + SZ + 'px!important;' +
            'height:'  + SZ + 'px!important;' +
            'z-index:10001!important;' +
            'margin:0!important;padding:0!important;overflow:visible!important;';

        /* Iframe izmērs */
        me.style.width  = SZ + 'px';
        me.style.height = SZ + 'px';
        me.style.border = 'none';

    } catch(e) { /* cross-origin — ignorē */ }
}

/* Izpilda tūlīt, pēc īsa kavējuma, un atkārtoti lai izturētu pārrenderēšanu */
fix();
setTimeout(fix, 300);
setTimeout(fix, 800);
setInterval(fix, 1500);
window.parent.addEventListener('resize', fix);

/* ── Mikrofons ────────────────────────────────────────────────────────────── */
var btn = document.getElementById('btn');
var mediaRecorder = null, chunks = [], recording = false;

btn.addEventListener('click', function() {
    if (recording) stopRec(); else startRec();
});

function startRec() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        chunks = [];
        var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
                 : MediaRecorder.isTypeSupported('audio/webm')             ? 'audio/webm'
                 : 'audio/ogg';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = function() {
            var blob = new Blob(chunks, { type: mime });
            var reader = new FileReader();
            reader.onloadend = function() {
                setValue({ type: 'audio', data: reader.result.split(',')[1], mimeType: mime });
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(function(t) { t.stop(); });
        };
        mediaRecorder.start();
        recording = true;
        btn.textContent = '⏹️';
        btn.classList.add('rec');
    }).catch(function(err) { alert('Mikrofons nav pieejams: ' + err.message); });
}

function stopRec() {
    if (mediaRecorder && recording) {
        mediaRecorder.stop();
        recording = false;
        btn.textContent = '🎙️';
        btn.classList.remove('rec');
    }
}
</script>
</body>
</html>
