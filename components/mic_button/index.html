<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
#btn {
    width: 100%; height: 100%;
    border: none; border-radius: 50%;
    background: transparent;
    cursor: pointer;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
}
#btn:hover { background: rgba(0,0,0,.08); }
#btn.recording { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse {
    0%,100% { filter: drop-shadow(0 0 0px rgba(220,38,38,0)); }
    50%      { filter: drop-shadow(0 0 7px rgba(220,38,38,.9)); }
}
</style>
</head>
<body>
<button id="btn" title="Ierunāt">🎙️</button>
<script>
"use strict";

/* ── Streamlit protokols ─────────────────────────────────────────────────── */
var _lastCounter = -1;

function post(msg) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), '*');
}
function setValue(v) { post({ type: 'streamlit:setComponentValue', value: v, dataType: 'json' }); }

window.addEventListener('message', function(ev) {
    if (!ev.data || ev.data.type !== 'streamlit:render') return;
    var c = (ev.data.args || {}).reset_counter;
    if (c == null) c = 0;
    if (c !== _lastCounter) { _lastCounter = c; if (recording) stopRec(); }
});

post({ type: 'streamlit:setFrameHeight', height: 36 });
post({ type: 'streamlit:componentReady', apiVersion: 1 });

/* ── Pašpārvietošanās uz parent dokumentu ───────────────────────────────── */
/* Komponents aizvieto sevi document.body līmenī, kur position:fixed darbojas
   pareizi — Streamlit's konteineri nevar to apslēpt ar overflow vai transform. */
var SZ = 36;

function findMe(pd) {
    var frames = pd.querySelectorAll('iframe');
    for (var i = 0; i < frames.length; i++) {
        try { if (frames[i].contentWindow === window) return frames[i]; } catch(e) {}
    }
    return null;
}

function reposition(me, pd) {
    var btn = pd.querySelector('[data-testid="stBottom"] button');
    if (!btn) return;
    var r = btn.getBoundingClientRect();
    me.style.bottom = Math.round(window.parent.innerHeight - r.top - r.height / 2 - SZ / 2) + 'px';
    me.style.right  = Math.round(window.parent.innerWidth  - r.left + 6) + 'px';
}

function relocate() {
    try {
        var pd = window.parent.document;
        var me = findMe(pd);
        if (!me) return;

        if (me.parentElement !== pd.body) {
            /* Sakļauj oriģinālo konteineru plūsmā */
            var wrap = me.parentElement;
            while (wrap && wrap !== pd.body) {
                if (wrap.getAttribute && wrap.getAttribute('data-testid') === 'stElementContainer') {
                    wrap.style.cssText = 'height:0!important;min-height:0!important;overflow:hidden!important;padding:0!important;margin:0!important;';
                    break;
                }
                wrap = wrap.parentElement;
            }
            /* Pārvieto iframe uz body */
            me.style.cssText =
                'position:fixed!important;border:none!important;' +
                'width:' + SZ + 'px!important;height:' + SZ + 'px!important;' +
                'z-index:10001!important;background:transparent!important;';
            pd.body.appendChild(me);
        }

        reposition(me, pd);
    } catch(e) {
        /* cross-origin vai cita kļūda — klusam ignorē */
    }
}

/* Izpilda tūlīt un atkārtoti līdz st.chat_input ielādējas */
relocate();
var _tries = 0;
var _iv = setInterval(function() {
    relocate();
    if (++_tries > 30) clearInterval(_iv);
}, 200);
window.parent.addEventListener('resize', function() { relocate(); });

/* ── Mikrofons ───────────────────────────────────────────────────────────── */
var micBtn = document.getElementById('btn');
var mediaRecorder = null, chunks = [], recording = false;

micBtn.addEventListener('click', function() {
    if (recording) stopRec(); else startRec();
});

function startRec() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        chunks = [];
        var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
                 : MediaRecorder.isTypeSupported('audio/webm')             ? 'audio/webm'
                 : 'audio/ogg';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = function() {
            var blob = new Blob(chunks, { type: mime });
            var reader = new FileReader();
            reader.onloadend = function() {
                setValue({ type: 'audio', data: reader.result.split(',')[1], mimeType: mime });
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(function(t) { t.stop(); });
        };
        mediaRecorder.start();
        recording = true;
        micBtn.textContent = '⏹️';
        micBtn.classList.add('recording');
    }).catch(function(err) { alert('Mikrofons nav pieejams: ' + err.message); });
}

function stopRec() {
    if (mediaRecorder && recording) {
        mediaRecorder.stop();
        recording = false;
        micBtn.textContent = '🎙️';
        micBtn.classList.remove('recording');
    }
}
</script>
</body>
</html>
