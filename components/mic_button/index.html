<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

#btn {
    width: 100%; height: 100%;
    border: none; border-radius: 50%;
    background: transparent;
    cursor: pointer;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
#btn:hover { background: rgba(0,0,0,.08); }

#btn.rec::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid rgba(220,38,38,.6);
    animation: ring 1.2s ease-out infinite;
}
@keyframes ring {
    0%   { transform: scale(1);   opacity: .8; }
    100% { transform: scale(1.5); opacity: 0;  }
}
</style>
</head>
<body>
<button id="btn" title="Nospied un runā">🎙️</button>

<script>
"use strict";

/* ── Streamlit protokols ─────────────────────────────────────────────── */
var _lastCounter = -1;

function post(msg) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), '*');
}
function setValue(v) { post({ type: 'streamlit:setComponentValue', value: v, dataType: 'json' }); }

window.addEventListener('message', function(ev) {
    if (!ev.data || ev.data.type !== 'streamlit:render') return;
    var c = (ev.data.args || {}).reset_counter;
    if (c == null) c = 0;
    if (c !== _lastCounter) { _lastCounter = c; if (recording) stopRec(false); }
});

post({ type: 'streamlit:setFrameHeight', height: 36 });
post({ type: 'streamlit:componentReady', apiVersion: 1 });

/* ── Pozicionēšana ───────────────────────────────────────────────────── */
var SZ = 36;

function fix() {
    try {
        var pd = window.parent.document;
        var me = null;
        var frames = pd.querySelectorAll('iframe');
        for (var i = 0; i < frames.length; i++) {
            try { if (frames[i].contentWindow === window) { me = frames[i]; break; } } catch(e) {}
        }
        if (!me) return;
        var target = me.parentElement;
        if (!target || target === pd.body) return;
        var sendBtn = pd.querySelector('[data-testid="stBottom"] button');
        if (!sendBtn) return;
        var r = sendBtn.getBoundingClientRect();
        var W = window.parent;
        target.style.cssText =
            'position:fixed!important;' +
            'bottom:' + Math.round(W.innerHeight - r.top - r.height / 2 - SZ / 2) + 'px!important;' +
            'right:'  + Math.round(W.innerWidth  - r.left + 6) + 'px!important;' +
            'width:'  + SZ + 'px!important;height:' + SZ + 'px!important;' +
            'z-index:10001!important;margin:0!important;padding:0!important;overflow:visible!important;';
        me.style.cssText = 'width:' + SZ + 'px;height:' + SZ + 'px;border:none;';
    } catch(e) {}
}

fix(); setTimeout(fix, 300); setTimeout(fix, 800);
setInterval(fix, 1500);
window.parent.addEventListener('resize', fix);

/* ── Ieraksts ────────────────────────────────────────────────────────── */
var SILENCE_DELAY_MS = 1500;
var CALIB_MS         = 600;
var MAX_REC_MS       = 30000;  // hard limit: 30s

var btn           = document.getElementById('btn');
var mediaRecorder = null, chunks = [], recording = false;
var audioCtx      = null, analyser = null;
var checkInterval = null;   // setInterval ID — aizvietojam requestAnimationFrame
var silenceStart  = null;

btn.addEventListener('click', function() {
    if (recording) stopRec(true); else startRec();
});

function startRec() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        chunks = [];

        var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
                 : MediaRecorder.isTypeSupported('audio/webm')             ? 'audio/webm'
                 : 'audio/ogg';

        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            var blob = new Blob(chunks, { type: mime });
            var reader = new FileReader();
            reader.onloadend = function() {
                setValue({ type: 'audio', data: reader.result.split(',')[1], mimeType: mime });
            };
            reader.readAsDataURL(blob);
        };
        mediaRecorder.start();

        /* Web Audio */
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var src  = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);

        var buf = new Uint8Array(analyser.fftSize);

        function getRms() {
            analyser.getByteTimeDomainData(buf);
            var sum = 0;
            for (var i = 0; i < buf.length; i++) {
                var v = (buf[i] - 128) / 128;
                sum += v * v;
            }
            return Math.sqrt(sum / buf.length);
        }

        /* Kalibrēšana */
        recording = true;
        btn.classList.add('rec');
        btn.style.opacity = '0.5';
        btn.title = 'Kalibrē...';

        var calibSamples = [];
        var calibStart   = Date.now();
        var recStart     = Date.now();
        var speechThresh = 0.05;

        var calibInterval = setInterval(function() {
            calibSamples.push(getRms());
            if (Date.now() - calibStart >= CALIB_MS) {
                clearInterval(calibInterval);

                var noise = calibSamples.reduce(function(a, b) { return a + b; }, 0) / calibSamples.length;
                speechThresh = Math.max(noise * 6, 0.05);
                btn.style.opacity = '1';
                btn.title = 'Runā... (klikšķis aptur)';

                silenceStart = Date.now();  /* taimeris sākas uzreiz pēc kalibrēšanas */

                /* Klusuma detektors — setInterval katras 50ms */
                checkInterval = setInterval(function() {
                    if (!recording) { clearInterval(checkInterval); return; }

                    /* Hard limit */
                    if (Date.now() - recStart >= MAX_REC_MS) {
                        clearInterval(checkInterval);
                        stopRec(true);
                        return;
                    }

                    var rms = getRms();

                    if (rms >= speechThresh) {
                        silenceStart = Date.now();
                        btn.style.opacity = '1';
                    } else {
                        var elapsed = Date.now() - silenceStart;
                        btn.style.opacity = Math.max(0.35, 1 - elapsed / SILENCE_DELAY_MS);
                        if (elapsed >= SILENCE_DELAY_MS) {
                            clearInterval(checkInterval);
                            stopRec(true);
                        }
                    }
                }, 50);
            }
        }, 30);

    }).catch(function(err) { alert('Mikrofons nav pieejams: ' + err.message); });
}

function stopRec(send) {
    if (!recording) return;
    recording = false;
    if (checkInterval) { clearInterval(checkInterval); checkInterval = null; }
    silenceStart = null;
    btn.style.opacity = '1';
    btn.classList.remove('rec');
    btn.textContent = '🎙️';
    btn.title = 'Nospied un runā';
    if (audioCtx) { audioCtx.close(); audioCtx = null; }

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        if (!send) {
            mediaRecorder.ondataavailable = null;
            mediaRecorder.onstop = function() {};
        }
        mediaRecorder.stop();
    }
}
</script>
</body>
</html>
